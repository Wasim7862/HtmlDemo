<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        /* Basic styling for body */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        /* Navbar styling */
        nav {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-size: 18px;
        }

        nav a:hover {
            background-color: #ddd;
            color: black;
            padding: 5px;
        }

        /* Main content styling */
        .main-content {
            padding: 20px;
            text-align: center;
            background-color: #fff;
            margin: 20px;
            border-radius: 8px;
        }

        /* Footer styling */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }

        /* Marquee styling */
        marquee {
            font-size: 1.5em;
            color: green;
            margin-bottom: 20px;
        }

        /* Styling for the heading message */
        h1 {
            color: green;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <!-- Marquee message -->
    <marquee>
        <h1>My name is Wasim, and I am not a terrorist.</h1>
    </marquee>

    <!-- Main content area -->
    <div class="main-content">
        <h2>Welcome to My Website!</h2>
        <p>This is a simple website with a navbar and footer.</p>
        <p>Explore the sections above to learn more.</p>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Wasim. All rights reserved.</p>
    </footer>

</body>

</html>
